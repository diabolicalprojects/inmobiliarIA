services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crm-ia-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crm_ia
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_ia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
